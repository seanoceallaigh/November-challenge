<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>November Challenge</title>
<meta name="description" content="A simple daily tracker for a month-long habit challenge.">
<meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="November">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F2EA; --card:#FFFFFF; --ink:#24221F; --muted:#7C766C; --line:#E8E1D4; --soft:#F1ECE2;
  --green:#2E8B57; --green-soft:#E2F1E7; --amber:#D18A22; --amber-soft:#FBEED6; --red:#C2543C; --red-soft:#F6E0D9;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 4px 14px rgba(40,30,10,.05);
  --radius:18px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161513; --card:#211F1C; --ink:#F1ECE3; --muted:#A39C90; --line:#35312B; --soft:#2A2723;
    --green:#4DB57B; --green-soft:#1E3226; --amber:#E8A645; --amber-soft:#382B16; --red:#E07A62; --red-soft:#3A221C;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 110px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--green)} .sync.busy i{background:var(--amber)} .sync.warn i{background:var(--red)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.daynav h1{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:30px;margin:0;line-height:1.1}
.daynav .sub{color:var(--muted);font-size:14px;margin-top:3px}
.arrow{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}
.arrow:disabled{opacity:.3;cursor:default}
.navmid{text-align:center;flex:1}

/* summary */
.summary{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0 18px;box-shadow:var(--shadow)}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,serif;font-weight:650;font-size:21px}
.sumtext b{font-size:17px;display:block;margin-bottom:2px}
.sumtext span{color:var(--muted);font-size:14px}
.certline{margin-top:6px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;background:var(--green-soft);color:var(--green)}
.certline.not{background:var(--soft);color:var(--muted)}

.banner{background:var(--amber-soft);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{font-weight:600;color:var(--amber);white-space:nowrap}

.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sechead h2{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sechead small{color:var(--muted);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.green{background:var(--green)} .dot.orange{background:var(--amber)} .dot.red{background:var(--red)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);transition:background .2s,border-color .2s}
.card.green{border-left:4px solid var(--green)} .card.orange{border-left:4px solid var(--amber)}
.card.met{background:linear-gradient(0deg,var(--green-soft),var(--green-soft))}
.card.orange.met{background:linear-gradient(0deg,var(--amber-soft),var(--amber-soft))}
.chead{display:flex;align-items:center;gap:12px}
.emoji{font-size:24px;width:30px;text-align:center;flex:none}
.ctitle{flex:1;min-width:0}
.ctitle b{display:block;font-size:16px;font-weight:600}
.ctitle span{display:block;font-size:13px;color:var(--muted)}
.tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:17px;color:transparent;transition:all .15s}
.met .tick{background:var(--green);border-color:var(--green);color:#fff}
.orange.met .tick{background:var(--amber);border-color:var(--amber)}
button.card{display:block;width:100%;text-align:left}
.cbody{margin-top:12px}

.stepper{display:flex;align-items:center;gap:10px}
.sbtn{width:44px;height:44px;border-radius:14px;background:var(--soft);font-size:22px;font-weight:600;display:grid;place-items:center;flex:none}
.sval{flex:1;text-align:center;font-family:Fraunces,serif;font-size:24px;font-weight:650}
.sval small{font-family:"DM Sans",sans-serif;font-size:14px;color:var(--muted);font-weight:500}
.drops{display:flex;gap:4px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.drops i{width:14px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--soft);display:inline-block}
.drops i.on{background:#4A9BD8}

.field{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 13px;font-size:16px;outline:none}
.field:focus{border-color:var(--ink)}
.row{display:flex;gap:10px;align-items:center}
.unit{color:var(--muted);font-size:14px;white-space:nowrap}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.orange .bar i{background:var(--amber)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.note b{color:var(--ink)}
.grat{display:flex;flex-direction:column;gap:8px}
.grat .row span{width:20px;color:var(--muted);font-weight:600;text-align:center}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stars{display:flex;gap:4px;margin-top:8px}
.stars button{font-size:22px;color:var(--line)}
.stars button.on{color:var(--amber)}
textarea.field{resize:vertical;min-height:60px}

/* month */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px}
.cal button,.cal .blank{aspect-ratio:1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600;position:relative}
.cal button{background:var(--soft)}
.cal button.p0{background:var(--soft)}
.cal button.p1{background:var(--red-soft)}
.cal button.p2{background:var(--amber-soft)}
.cal button.p3{background:var(--green-soft)}
.cal button.p4{background:var(--green);color:#fff}
.cal button.future{opacity:.35}
.cal button.sel{outline:2px solid var(--ink);outline-offset:1px}
.cal button .c{font-size:9px;line-height:1;margin-top:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 4px 0}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

.goalrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.goalrow .gtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.goalrow .gtop b{flex:1;font-size:14px;font-weight:600}
.goalrow .gtop small{font-size:12px;color:var(--muted);white-space:nowrap}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.strip i{height:14px;border-radius:3px;background:var(--soft)}
.strip i.y{background:var(--green)} .strip i.n{background:var(--red-soft)} .strip i.f{background:transparent;border:1px dashed var(--line)}
.orange-row .strip i.y{background:var(--amber)}
.albums .card{display:flex;gap:12px;align-items:center}
.wk{font-family:Fraunces,serif;font-weight:650;font-size:13px;color:var(--muted);width:46px;flex:none}
.spark{width:100%;height:70px;display:block}

/* setup */
.setrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.setrow .chead{margin-bottom:10px}
.seg3 button.on.g{background:var(--green);color:#fff}
.seg3 button.on.o{background:var(--amber);color:#fff}
.seg3 button.on.r{background:var(--red);color:#fff}
.counts{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
.pill{font-size:13px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--soft)}
.pill.good{background:var(--green-soft);color:var(--green)}
.pill.bad{background:var(--amber-soft);color:var(--amber)}
.intro{color:var(--muted);font-size:14px;margin:4px 4px 12px}
.targets .row{justify-content:space-between;margin-bottom:10px}
.targets .row label{font-size:15px;font-weight:500}
.targets .field{width:110px;text-align:right}
.dropped{opacity:.55}

.btn{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px}
.btn.ghost{background:var(--soft);color:var(--ink)}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabs .in{display:flex;gap:6px;max-width:560px;width:100%}
.tabs button{flex:1;padding:9px 4px;border-radius:12px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:19px}
.tabs button.on{background:var(--soft);color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs"><div class="in">
  <button data-act="tab" data-v="today"><span>☀️</span>Today</button>
  <button data-act="tab" data-v="month"><span>🗓️</span>Month</button>
  <button data-act="tab" data-v="setup"><span>⚙️</span>Setup</button>
</div></nav>

<script>
(function(){
const YEAR = 2026, MONTH = 10, DAYS = 30; // November 2026
const LS_KEY = 'nov-challenge-2026-v1';
const GOALS = [
  {id:'alcohol',  emoji:'🍷', name:'No alcohol',            type:'check', hint:'Alcohol-free today'},
  {id:'eggs',     emoji:'🥚', name:'Eggs every day',        type:'check', hint:'Had eggs today'},
  {id:'water',    emoji:'💧', name:'Lots more water',       type:'water'},
  {id:'sleep',    emoji:'😴', name:'6–7 hours of sleep',    type:'sleep'},
  {id:'steps',    emoji:'👟', name:'8k steps',              type:'steps'},
  {id:'pushups',  emoji:'💪', name:'Max push-ups',          type:'pushups'},
  {id:'stretch',  emoji:'🧘', name:'Whole-body stretch',    type:'check', hint:'Everything, head to toe'},
  {id:'grateful', emoji:'🙏', name:'3 things I’m grateful for', type:'grateful'},
  {id:'screen',   emoji:'📱', name:'Less screen time',      type:'screen'},
  {id:'takeaway', emoji:'🥡', name:'Max 1 takeaway a week', type:'takeaway'},
  {id:'album',    emoji:'🎧', name:'1 new album a week',    type:'album'},
];
const G = Object.fromEntries(GOALS.map(g=>[g.id,g]));

function blank(){
  return {v:1, updatedAt:0,
    settings:{status:Object.fromEntries(GOALS.map(g=>[g.id,'orange'])), water:8, screen:3, steps:8000},
    days:{}, weeks:{}};
}
function normalize(s){
  const b = blank();
  if(!s || typeof s!=='object') return b;
  const out = {v:1, updatedAt:+s.updatedAt||0, settings:Object.assign({},b.settings,s.settings||{}), days:Object.assign({},s.days||{}), weeks:Object.assign({},s.weeks||{})};
  out.settings.status = Object.assign({}, b.settings.status, (s.settings&&s.settings.status)||{});
  return out;
}
const clone = o => JSON.parse(JSON.stringify(o));

let state = blank();
try{ const raw = localStorage.getItem(LS_KEY); if(raw) state = normalize(JSON.parse(raw)); }catch(e){}

// ---------- dates ----------
function todayDay(){
  const n = new Date();
  if(n.getFullYear()<YEAR || (n.getFullYear()===YEAR && n.getMonth()<MONTH)) return 0;
  if(n.getFullYear()>YEAR || n.getMonth()>MONTH) return DAYS+1;
  return n.getDate();
}
let TODAY = todayDay();
let MAXDAY = Math.min(Math.max(TODAY,1),DAYS);
let view = 'today', sel = MAXDAY;
const weekOf = d => Math.min(4, Math.floor((d-1)/7)+1);
const weekRange = w => w<4 ? [ (w-1)*7+1, w*7 ] : [22, 30];
const dateOf = d => new Date(YEAR, MONTH, d);
const fmtLong = d => dateOf(d).toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
const fmtShort = d => dateOf(d).toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
const isFuture = d => d > TODAY;

// ---------- data helpers ----------
const day = d => state.days[d] || {};
function dayMut(d){ if(!state.days[d]) state.days[d] = {}; return state.days[d]; }
function weekMut(w){ if(!state.weeks[w]) state.weeks[w] = {}; return state.weeks[w]; }
const S = () => state.settings;
const statusOf = id => S().status[id] || 'orange';
const has = v => v!==undefined && v!==null && v!=='';
function weekTakeaways(w){ const [a,b]=weekRange(w); let n=0; for(let d=a;d<=b;d++) if(day(d).takeaway) n++; return n; }
function pushBest(){ let best=0, on=0; for(let d=1;d<=DAYS;d++){ const v=+day(d).pushups||0; if(v>best){best=v;on=d;} } return {best,on}; }

// true = met, false = missed, null = not counted (future / still pending)
function met(id, d){
  if(isFuture(d)) return null;
  const x = day(d), s = S();
  switch(G[id].type){
    case 'check': return !!x[id];
    case 'water': return (+x.water||0) >= s.water;
    case 'sleep': return (+x.sleep||0) >= 6;
    case 'steps': return (+x.steps||0) >= s.steps;
    case 'pushups': return (+x.pushups||0) > 0;
    case 'grateful': return (x.grateful||[]).filter(t=>t&&String(t).trim()).length >= 3;
    case 'screen': return has(x.screen) && +x.screen <= s.screen;
    case 'takeaway': return weekTakeaways(weekOf(d)) <= 1;
    case 'album': {
      const w = weekOf(d), done = !!((state.weeks[w]||{}).album||'').trim();
      if(done) return true;
      const end = weekRange(w)[1];
      return (d===end || TODAY>end) ? false : null; // only a miss once the week is over
    }
  }
  return null;
}
const active = () => GOALS.filter(g=>statusOf(g.id)!=='red');
function dayScore(d){
  let m=0,c=0; for(const g of active()){ const r=met(g.id,d); if(r===null) continue; c++; if(r) m++; }
  return {m,c,p:c?m/c:0};
}
function certScore(d){
  const greens = GOALS.filter(g=>statusOf(g.id)==='green');
  let m=0; for(const g of greens) if(met(g.id,d)===true) m++;
  return {m, n:greens.length};
}
function streak(id){
  let d = Math.min(TODAY,DAYS); if(d<1) return 0;
  if(met(id,d)!==true) d--;
  let n=0; while(d>=1 && met(id,d)===true){ n++; d--; }
  return n;
}

// ---------- saving (on this device) ----------
let storageOK = true;
try{ localStorage.setItem(LS_KEY+'-test','1'); localStorage.removeItem(LS_KEY+'-test'); }catch(e){ storageOK=false; }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
function syncHTML(){
  return storageOK ? `<div class="sync ok" id="sync"><i></i>Saved on this phone</div>`
                   : `<div class="sync warn" id="sync"><i></i>Not saving — private tab?</div>`;
}
function save(){
  state.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); storageOK=true; }catch(e){ storageOK=false; }
}
function backupText(){ return JSON.stringify({app:'november-challenge', exported:new Date().toISOString(), data:state}); }
function restoreFrom(text){
  let obj; try{ obj=JSON.parse(text); }catch(e){ return 'That doesn’t look like a backup — copy the whole thing and try again.'; }
  const data = obj && obj.data ? obj.data : obj;
  if(!data || typeof data!=='object' || !data.settings){ return 'That doesn’t look like a November Challenge backup.'; }
  state = normalize(data); save(); return null;
}

// ---------- rendering ----------
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = document.getElementById('app');

function ringHTML(p, label){
  const r=33, C=2*Math.PI*r;
  return `<div class="ring"><svg width="78" height="78" viewBox="0 0 78 78">
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="var(--soft)" stroke-width="8"/>
    <circle cx="39" cy="39" r="${r}" fill="none" stroke="var(--green)" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" style="transition:stroke-dashoffset .4s"/>
  </svg><div class="num">${label}</div></div>`;
}
function summaryHTML(){
  const sc = dayScore(sel), cs = certScore(sel);
  const msg = sc.c && sc.m===sc.c ? 'Full house today! 🎉' : sc.m===0 ? 'Fresh start — tick things off as you go' : `${sc.c-sc.m} still to go`;
  const cert = cs.n ? `<div class="certline ${cs.m===cs.n?'':'not'}">${cs.m===cs.n?'✓':'🟢'} Certs ${cs.m}/${cs.n}${cs.m===cs.n?' — nailed':''}</div>` : '';
  return `${ringHTML(sc.c?sc.p:0, `${sc.m}/${sc.c}`)}<div class="sumtext"><b>${msg}</b><span>${active().length} goals in play</span><br>${cert}</div>`;
}

function cardInner(g){
  const x = day(sel), s = S(), id=g.id;
  switch(g.type){
    case 'check': return '';
    case 'water': {
      const v=+x.water||0; let drops=''; for(let i=0;i<Math.max(s.water,v);i++) drops+=`<i class="${i<v?'on':''}"></i>`;
      return `<div class="stepper"><button class="sbtn" data-act="inc" data-k="water" data-v="-1" aria-label="One fewer glass">−</button>
        <div class="sval">${v}<small> / ${s.water} glasses</small></div>
        <button class="sbtn" data-act="inc" data-k="water" data-v="1" aria-label="One more glass">+</button></div><div class="drops">${drops}</div>`;
    }
    case 'sleep': {
      const v=has(x.sleep)?+x.sleep:null;
      return `<div class="stepper"><button class="sbtn" data-act="inc" data-k="sleep" data-v="-0.5" aria-label="Less sleep">−</button>
        <div class="sval">${v===null?'–':v}<small> hours last night</small></div>
        <button class="sbtn" data-act="inc" data-k="sleep" data-v="0.5" aria-label="More sleep">+</button></div>`;
    }
    case 'steps': {
      const v=has(x.steps)?x.steps:'';
      return `<div class="row"><input class="field" inputmode="numeric" pattern="[0-9]*" placeholder="Steps today" data-in="steps" value="${esc(v)}"><span class="unit">/ ${(+s.steps).toLocaleString('en-GB')}</span></div>
        <div class="bar"><i id="stepsbar" style="width:${Math.min(100,(+v||0)/s.steps*100)}%"></i></div>`;
    }
    case 'pushups': {
      const v=has(x.pushups)?x.pushups:'';
      return `<div class="row"><input class="field" inputmode="numeric" pattern="[0-9]*" placeholder="Max in one set" data-in="pushups" value="${esc(v)}"><span class="unit">push-ups</span></div>
        <div class="note" id="pbest">${pbestHTML()}</div>`;
    }
    case 'grateful': {
      const a=x.grateful||[];
      return `<div class="grat">${[0,1,2].map(i=>`<div class="row"><span>${i+1}</span><input class="field" placeholder="${['Something small','Someone','A moment from today'][i]}" data-in="grat" data-i="${i}" value="${esc(a[i]||'')}"></div>`).join('')}</div>`;
    }
    case 'screen': {
      const v=has(x.screen)?x.screen:'';
      return `<div class="row"><input class="field" inputmode="decimal" placeholder="From Screen Time" data-in="screen" value="${esc(v)}"><span class="unit">hrs (target ≤ ${s.screen})</span></div>`;
    }
    case 'takeaway': {
      const w=weekOf(sel), n=weekTakeaways(w);
      return `<div class="seg"><button class="${!x.takeaway?'on':''}" data-act="takeaway" data-v="0">No takeaway</button><button class="${x.takeaway?'on':''}" data-act="takeaway" data-v="1">Had a takeaway</button></div>
        <div class="note">This week: <b>${n} of 1</b>${n>1?' — over the limit':n===1?' — that’s your one':' — one still available'}</div>`;
    }
    case 'album': {
      const w=weekOf(sel), a=state.weeks[w]||{}, [d1,d2]=weekRange(w), st=+a.stars||0;
      return `<div class="note" style="margin-top:0;margin-bottom:8px">Week ${w} · ${d1}–${d2} Nov</div>
        <div class="grat"><input class="field" placeholder="Album" data-in="album" value="${esc(a.album||'')}">
        <input class="field" placeholder="Artist" data-in="artist" value="${esc(a.artist||'')}">
        <textarea class="field" placeholder="What did you think?" data-in="note">${esc(a.note||'')}</textarea></div>
        <div class="stars">${[1,2,3,4,5].map(i=>`<button class="${i<=st?'on':''}" data-act="star" data-v="${i}" aria-label="${i} stars">★</button>`).join('')}</div>`;
    }
  }
  return '';
}
function pbestHTML(){
  const {best,on}=pushBest(); const v=+day(sel).pushups||0;
  if(!best) return 'Log your first set to start a personal best.';
  if(v && v===best && on===sel) return `🏆 <b>Personal best: ${best}</b>`;
  return `Personal best: <b>${best}</b> (${fmtShort(on)})`;
}
function subOf(g){
  const s=S(), x=day(sel);
  switch(g.type){
    case 'check': return g.hint;
    case 'water': return `Target ${s.water} glasses`;
    case 'sleep': return 'Aim for 6–7 hours';
    case 'steps': return `Target ${(+s.steps).toLocaleString('en-GB')}`;
    case 'pushups': return 'One all-out set';
    case 'grateful': return 'Write all three';
    case 'screen': return `Under ${s.screen} hours`;
    case 'takeaway': return 'Logged per day, counted per week';
    case 'album': return 'Something you’ve never heard';
  }
  return '';
}
function cardHTML(g){
  const st=statusOf(g.id), m=met(g.id,sel)===true;
  const head = `<div class="chead"><div class="emoji">${g.emoji}</div><div class="ctitle"><b>${esc(g.name)}</b><span>${esc(subOf(g))}</span></div><div class="tick">✓</div></div>`;
  if(g.type==='check') return `<button class="card ${st} ${m?'met':''}" data-goal="${g.id}" data-act="toggle" data-k="${g.id}" aria-pressed="${m}">${head}</button>`;
  return `<div class="card ${st} ${m?'met':''}" data-goal="${g.id}">${head}<div class="cbody">${cardInner(g)}</div></div>`;
}

function renderToday(){
  const greens=GOALS.filter(g=>statusOf(g.id)==='green'), oranges=GOALS.filter(g=>statusOf(g.id)==='orange');
  const needSetup = greens.length===0;
  const notStarted = TODAY<1;
  return `
  <div class="top"><div class="eyebrow">November Challenge</div>${syncHTML()}</div>
  <div class="daynav">
    <button class="arrow" data-act="nav" data-v="-1" ${sel<=1?'disabled':''} aria-label="Previous day">‹</button>
    <div class="navmid"><h1>${sel===TODAY?'Today':esc(fmtShort(sel))}</h1><div class="sub">${sel===TODAY?esc(fmtLong(sel))+' · ':''}Day ${sel} of ${DAYS}</div></div>
    <button class="arrow" data-act="nav" data-v="1" ${sel>=MAXDAY?'disabled':''} aria-label="Next day">›</button>
  </div>
  ${notStarted?`<div class="banner">The challenge starts on 1 November.</div>`:''}
  <div class="summary" id="summary">${summaryHTML()}</div>
  ${needSetup?`<div class="banner"><span>Choose your certs 🟢 and 1–2 to drop 🔴</span><button data-act="tab" data-v="setup">Set up →</button></div>`:''}
  ${greens.length?`<div class="sechead"><h2><span class="dot green"></span>Certs — 100%</h2><small>${greens.length} goal${greens.length>1?'s':''}</small></div>${greens.map(cardHTML).join('')}`:''}
  ${oranges.length?`<div class="sechead"><h2><span class="dot orange"></span>Best shot</h2><small>${oranges.length} goals</small></div>${oranges.map(cardHTML).join('')}`:''}
  `;
}

function calClass(d){
  if(isFuture(d)) return 'future';
  const {m,c,p}=dayScore(d);
  if(!c || m===0) return 'p0';
  if(p>=1) return 'p4'; if(p>=.7) return 'p3'; if(p>=.4) return 'p2'; return 'p1';
}
function renderMonth(){
  const first = (dateOf(1).getDay()+6)%7; // Monday-first
  let cells = ['M','T','W','T','F','S','S'].map(x=>`<div class="dow">${x}</div>`).join('');
  for(let i=0;i<first;i++) cells+='<div class="blank"></div>';
  for(let d=1; d<=DAYS; d++){
    const cs=certScore(d), certs = !isFuture(d) && cs.n && cs.m===cs.n;
    cells += `<button class="${calClass(d)} ${d===sel?'sel':''}" data-act="goto" data-v="${d}" ${isFuture(d)?'disabled':''} aria-label="${fmtLong(d)}">${d}${certs?'<span class="c">🟢</span>':''}</button>`;
  }
  let done=0, days=0; for(let d=1; d<=Math.min(TODAY,DAYS); d++){ days++; if(dayScore(d).p>=1) done++; }

  const rows = active().map(g=>{
    let strip=''; for(let d=1; d<=DAYS; d++){ const r=met(g.id,d); strip+=`<i class="${isFuture(d)?'f':r===true?'y':r===false?'n':''}"></i>`; }
    const n=streak(g.id); let hit=0,cnt=0; for(let d=1; d<=DAYS; d++){ const r=met(g.id,d); if(r!==null){cnt++; if(r) hit++;} }
    return `<div class="goalrow ${statusOf(g.id)}-row"><div class="gtop"><span>${g.emoji}</span><b>${esc(g.name)}</b><small>${n?`🔥 ${n} day${n>1?'s':''} · `:''}${hit}/${cnt}</small></div><div class="strip">${strip}</div></div>`;
  }).join('');

  // push-up sparkline
  const pts=[]; for(let d=1; d<=DAYS; d++){ const v=+day(d).pushups||0; if(v) pts.push([d,v]); }
  let spark='';
  if(pts.length){
    const max=Math.max(...pts.map(p=>p[1])), W=300, H=60;
    const xy=pts.map(([d,v])=>[ (d-1)/(DAYS-1)*(W-10)+5, H-5-(v/max)*(H-15) ]);
    spark = `<div class="card"><div class="chead"><div class="emoji">💪</div><div class="ctitle"><b>Push-ups</b><span>Best ${max} · ${pts.length} day${pts.length>1?'s':''} logged</span></div></div>
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${xy.map(p=>p.join(',')).join(' ')}"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--green)"/>`).join('')}</svg></div>`;
  }

  const albums = [1,2,3,4].map(w=>{
    const a=state.weeks[w]||{}, [d1,d2]=weekRange(w), st=+a.stars||0;
    return `<div class="card"><div class="wk">Wk ${w}<br><span style="font-weight:500;font-family:DM Sans">${d1}–${d2}</span></div><div class="ctitle">${a.album?`<b>${esc(a.album)}</b><span>${esc(a.artist||'')}${st?' · '+'★'.repeat(st):''}</span>`:`<span>Not picked yet</span>`}</div></div>`;
  }).join('');

  return `
  <div class="top"><div class="eyebrow">November Challenge</div>${syncHTML()}</div>
  <div class="daynav"><div><h1>The month</h1><div class="sub">${days?`${done} full-house day${done===1?'':'s'} out of ${days}`:'Starts 1 November'}</div></div></div>
  <div class="cal" style="margin-top:14px">${cells}</div>
  <div class="legend"><span><i style="background:var(--green)"></i>All done</span><span><i style="background:var(--green-soft)"></i>70%+</span><span><i style="background:var(--amber-soft)"></i>40%+</span><span><i style="background:var(--red-soft)"></i>Under 40%</span><span>🟢 all certs</span></div>
  <div class="sechead"><h2>Goal by goal</h2><small>tap a day above to edit it</small></div>
  ${rows || '<div class="empty">No active goals.</div>'}
  ${spark?`<div class="sechead"><h2>Progress</h2></div>${spark}`:''}
  <div class="sechead"><h2>🎧 Albums</h2></div><div class="albums">${albums}</div>`;
}

function renderSetup(){
  const st=S().status, nG=GOALS.filter(g=>st[g.id]==='green').length, nR=GOALS.filter(g=>st[g.id]==='red').length;
  const rows = GOALS.map(g=>{ const v=st[g.id];
    return `<div class="setrow ${v==='red'?'dropped':''}"><div class="chead"><div class="emoji">${g.emoji}</div><div class="ctitle"><b>${esc(g.name)}</b></div></div>
    <div class="seg seg3"><button class="${v==='green'?'on g':''}" data-act="status" data-k="${g.id}" data-v="green">🟢 Cert</button><button class="${v==='orange'?'on o':''}" data-act="status" data-k="${g.id}" data-v="orange">🟠 Best shot</button><button class="${v==='red'?'on r':''}" data-act="status" data-k="${g.id}" data-v="red">🔴 Drop</button></div></div>`;
  }).join('');
  const s=S();
  return `
  <div class="top"><div class="eyebrow">November Challenge</div>${syncHTML()}</div>
  <div class="daynav"><div><h1>Setup</h1><div class="sub">Your rules for the month</div></div></div>
  <p class="intro">Pick your absolute certs — as many as you like — that you’ll hit 100%, give the rest your best shot, and drop one or two you know you can’t commit to.</p>
  <div class="counts"><span class="pill ${nG>0?'good':'bad'}">🟢 ${nG} cert${nG===1?'':'s'}</span><span class="pill ${nR>=1&&nR<=2?'good':'bad'}">🔴 ${nR} dropped (1–2)</span></div>
  ${rows}
  <div class="sechead"><h2>Targets</h2></div>
  <div class="card targets">
    <div class="row"><label for="t-water">💧 Glasses of water a day</label><input id="t-water" class="field" inputmode="numeric" data-set="water" value="${esc(s.water)}"></div>
    <div class="row"><label for="t-screen">📱 Max screen time (hours)</label><input id="t-screen" class="field" inputmode="decimal" data-set="screen" value="${esc(s.screen)}"></div>
    <div class="row" style="margin-bottom:0"><label for="t-steps">👟 Steps a day</label><input id="t-steps" class="field" inputmode="numeric" data-set="steps" value="${esc(s.steps)}"></div>
  </div>
  <div class="sechead"><h2>💾 Backup</h2></div>
  <div class="card">
    <p class="intro" style="margin:0 0 12px">Your log lives on this phone only. Save a backup every week or so — and before changing phones or clearing your browser.</p>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn" data-act="copybk">Copy backup</button>
      <button class="btn ghost" data-act="dlbk">Download file</button>
    </div>
    <div class="note" id="bkmsg"></div>
    <details style="margin-top:14px"><summary class="note" style="cursor:pointer;font-weight:600;color:var(--ink)">Restore from a backup</summary>
      <textarea class="field" id="restoreText" placeholder="Paste a backup here" style="margin-top:10px"></textarea>
      <div class="row" style="margin-top:10px;flex-wrap:wrap">
        <button class="btn" data-act="restore">Restore</button>
        <label class="btn ghost" style="display:inline-block">Choose file<input type="file" id="restoreFile" accept=".json,application/json,text/plain" hidden></label>
      </div>
      <div class="note">Restoring replaces everything currently on this phone.</div>
    </details>
  </div>
  <p class="intro" style="text-align:center;margin-top:20px">Tip: add this page to your Home Screen so it opens like an app.</p>`;
}

function render(){
  app.innerHTML = view==='today' ? renderToday() : view==='month' ? renderMonth() : renderSetup();
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===view));
}
// light refresh used while typing, so inputs keep focus
function refresh(){
  if(view!=='today') return;
  const sm=document.getElementById('summary'); if(sm) sm.innerHTML = summaryHTML();
  document.querySelectorAll('.card[data-goal]').forEach(el=>el.classList.toggle('met', met(el.dataset.goal, sel)===true));
  const sb=document.getElementById('stepsbar'); if(sb) sb.style.width = Math.min(100,(+day(sel).steps||0)/S().steps*100)+'%';
  const pb=document.getElementById('pbest'); if(pb) pb.innerHTML = pbestHTML();
}

// ---------- events ----------
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a=b.dataset.act, k=b.dataset.k, v=b.dataset.v;
  if(a==='tab'){ view=v; render(); window.scrollTo(0,0); return; }
  if(a==='nav'){ sel=Math.min(MAXDAY,Math.max(1,sel+ +v)); render(); return; }
  if(a==='goto'){ sel=+v; view='today'; render(); window.scrollTo(0,0); return; }
  if(a==='copybk'){
    const t=backupText(), msg=document.getElementById('bkmsg');
    const ok=()=>{ msg.textContent='Copied ✓ — paste it into a note or email to yourself.'; };
    const fallback=()=>{ const ta=document.getElementById('restoreText'); ta.closest('details').open=true; ta.value=t; ta.select(); msg.textContent='Couldn’t copy automatically — it’s selected in the box below, copy it from there.'; };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,fallback); else fallback();
    return;
  }
  if(a==='dlbk'){
    const blob=new Blob([backupText()],{type:'application/json'}), url=URL.createObjectURL(blob), el=document.createElement('a');
    el.href=url; el.download='november-challenge-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(el); el.click(); el.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    document.getElementById('bkmsg').textContent='Backup file saved to your downloads.';
    return;
  }
  if(a==='restore'){
    const ta=document.getElementById('restoreText');
    if(!ta.value.trim()){ document.getElementById('bkmsg').textContent='Paste a backup into the box first.'; return; }
    if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='Tap again to replace this phone’s log'; return; }
    const err=restoreFrom(ta.value); render(); document.getElementById('bkmsg').textContent = err || 'Restored ✓'; return;
  }
  if(isFuture(sel) && ['toggle','inc','takeaway','star'].includes(a)) return;
  if(a==='toggle'){ const x=dayMut(sel); x[k]=!x[k]; }
  else if(a==='inc'){
    const x=dayMut(sel);
    if(k==='sleep'){ const cur=has(x.sleep)?+x.sleep:6.5; x.sleep = has(x.sleep) ? Math.min(14,Math.max(0,cur+ +v)) : 6.5; }
    else x[k]=Math.max(0,(+x[k]||0)+ +v);
  }
  else if(a==='takeaway'){ dayMut(sel).takeaway = v==='1'; }
  else if(a==='star'){ const w=weekMut(weekOf(sel)); w.stars = (+w.stars===+v) ? 0 : +v; }
  else if(a==='status'){ S().status[k]=v; }
  else return;
  save(); render();
});
document.addEventListener('change', e=>{
  if(e.target.id!=='restoreFile' || !e.target.files[0]) return;
  e.target.files[0].text().then(t=>{ const err=restoreFrom(t); render(); document.getElementById('bkmsg').textContent = err || 'Restored ✓'; });
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.in){
    const k=el.dataset.in;
    if(k==='grat'){ const x=dayMut(sel); const arr=(x.grateful||['','','']).slice(); while(arr.length<3) arr.push(''); arr[+el.dataset.i]=el.value; x.grateful=arr; }
    else if(k==='album'||k==='artist'||k==='note'){ weekMut(weekOf(sel))[k]=el.value; }
    else {
      const raw = k==='screen' ? el.value.replace(',', '.').replace(/[^0-9.]/g,'') : el.value.replace(/\D/g,'');
      dayMut(sel)[k] = raw==='' ? '' : (k==='screen' ? raw : String(parseInt(raw,10)||0));
    }
    save(); refresh();
  } else if(el.dataset.set){
    const n=parseFloat(el.value.replace(',', '.'));
    if(!isNaN(n) && n>0){ S()[el.dataset.set]=n; save(); }
  }
});

render();
// the app can sit open for days on a home screen — catch up when it comes back
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible') return;
  const t=todayDay(); if(t===TODAY) return;
  const wasToday = sel===MAXDAY; TODAY=t; MAXDAY=Math.min(Math.max(TODAY,1),DAYS);
  if(wasToday) sel=MAXDAY; render();
});
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
